<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Klinikler ve Hekimler - PetCare AI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background-color: #f4f7f6;">

    <header class="topbar">
        <h1>PetCare AI</h1>
        <nav>
            <a href="index.html">Anasayfa</a>
            <a href="veterinerler.html" style="color: var(--secondary-mavi); font-weight: bold; border-bottom: 2px solid var(--secondary-mavi); padding-bottom: 5px;">Kliniklerimiz</a>
            <a href="index.html" onclick="localStorage.removeItem('loggedIn'); localStorage.removeItem('loggedInUser');">Randevu Al</a>
        </nav>
    </header>

    <div class="container" style="margin-bottom: 60px;">
        <h2 style="text-align: center; margin-top: 40px; color: var(--secondary-mavi); font-size: 28px;">🏥 Anlaşmalı Kliniklerimiz</h2>
        <p style="text-align: center; color: var(--text-secondary); margin-bottom: 30px; font-size: 15px;">Size en yakın kliniği bulun ve uzman hekim kadrosunu inceleyin.</p>
        
        <div class="filter-section" style="max-width: 800px; margin: 0 auto 40px auto; display: flex; gap: 15px; background: white; padding: 25px; border-radius: 12px; border-left: 5px solid var(--primary-yesil); box-shadow: 0 5px 15px rgba(0,0,0,0.05);">
            <div style="min-width: 150px; flex: 1;">
                <label for="clinicSortMode" style="display:block; font-weight:600; margin-bottom:8px;">Sıralama</label>
                <select id="clinicSortMode" onchange="setClinicSort()" style="width:100%; padding:12px; border:1px solid #ddd; border-radius:8px; background:#f9f9f9;">
                    <option value="name">Klinik adı</option>
                    <option value="rating">En yüksek puan</option>
                    <option value="reviews">En çok değerlendirme</option>
                </select>
            </div>

            <div style="flex: 1;">
                <label style="font-size: 14px; font-weight: bold; color: var(--secondary-mavi); display: block; margin-bottom: 5px;">Şehir</label>
                <select id="filterCity" onchange="updateFilterDistricts()" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; background: #f9f9f9;">
                    <option value="all">-- Tüm Şehirler --</option>
                    <option value="İstanbul">İstanbul</option>
                    <option value="Ankara">Ankara</option>
                    <option value="İzmir">İzmir</option>
                    <option value="Antalya">Antalya</option>
                    <option value="Bursa">Bursa</option>
                 </select>
            </div>
            <div style="flex: 1;">
                <label style="font-size: 14px; font-weight: bold; color: var(--secondary-mavi); display: block; margin-bottom: 5px;">İlçe / Semt</label>
                <select id="filterDistrict" onchange="renderClinics()" disabled style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; outline: none; background: #eee;">
                    <option value="all">-- Tüm İlçeler --</option>
                </select>
            </div>
            <div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px;">
                <label style="cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: bold; color: var(--primary-yesil); background: #e8f5e9; padding: 10px; border-radius: 8px; width: 100%; border: 1px solid #c8e6c9;">
                    <input type="checkbox" id="filterBeds" onchange="renderClinics()" style="width: 18px; height: 18px; cursor: pointer;">
                    Boş Yatak Olanlar
                </label>
                
                <label style="cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: bold; color: var(--accent-turuncu); background: #fff3e0; padding: 10px; border-radius: 8px; width: 100%; border: 1px solid #ffe0b2;">
                    <input type="checkbox" id="filterEmergency" onchange="renderClinics()" style="width: 18px; height: 18px; cursor: pointer;">
                    7/24 Acil Hizmeti
                </label>
            </div>
        </div>
        
        <div id="clinics-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 25px; max-width: 1000px; margin: 0 auto;"></div>
    </div>

    <div id="vetDetailModal" class="modal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); align-items: center; justify-content: center;">
        <div class="modal-content" style="background: white; padding: 30px; border-radius: 15px; width: 90%; max-width: 450px; text-align: center; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.2);">
            <button onclick="closeVetModal()" style="position: absolute; top: 15px; right: 20px; background: none; border: none; font-size: 28px; cursor: pointer; color: #aaa;">&times;</button>
            
            <img id="modalVetPhoto" src="" style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid var(--secondary-mavi); margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
            <h3 id="modalVetName" style="color: var(--secondary-mavi); margin-top: 0; margin-bottom: 5px; font-size: 22px;"></h3>
            <p id="modalVetClinic" style="color: var(--primary-yesil); font-weight: bold; font-size: 15px; margin-top: 0;"></p>

            <div style="text-align: left; margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px;">
                <p style="margin: 10px 0; font-size: 15px;"><b>⭐ Deneyim:</b> <span id="modalVetExperience"></span> Yıl</p>
                
                <h4 style="margin-bottom: 10px; margin-top: 20px; color: var(--secondary-mavi); font-size: 16px;">Hakkında / Uzmanlık</h4>
                <p id="modalVetBio" style="font-size: 14px; line-height: 1.6; color: var(--text-secondary); background: #f9f9f9; padding: 15px; border-radius: 8px; border-left: 4px solid var(--primary-yesil); margin: 0;"></p>
            </div>

            <a href="book-appointment.html" style="display: block; margin-top: 25px; width: 100%; background-color: var(--secondary-mavi); color: white; padding: 15px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 16px; transition: 0.2s;" onmouseover="this.style.background='#1565C0'" onmouseout="this.style.background='var(--secondary-mavi)'">Bu Hekimden Randevu Al</a>
        </div>
    </div>
    
    <script src="js/vets-list.js"></script>
</body>
</html>
